name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            method: cross
            archive: tar.gz

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            method: cargo
            archive: zip

          - os: windows-latest
            target: i686-pc-windows-msvc
            method: cargo
            archive: zip

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            method: cargo
            archive: zip

          # macOS
          - os: macos-latest
            target: aarch64-apple-darwin
            method: cargo
            archive: tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            method: cargo
            archive: tar.gz

          # Android
          - os: ubuntu-latest
            target: aarch64-linux-android
            method: android
            archive: tar.gz

          - os: ubuntu-latest
            target: armv7-linux-androideabi
            method: android
            archive: tar.gz

          - os: ubuntu-latest
            target: i686-linux-android
            method: android
            archive: tar.gz

          - os: ubuntu-latest
            target: x86_64-linux-android
            method: android
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux cross compilation
      - name: Install cross
        if: matrix.method == 'cross'
        uses: taiki-e/install-action@cross

      # Android SDK setup
      - name: Set up Java
        if: matrix.method == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.method == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android NDK
        if: matrix.method == 'android'
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # Android linker configuration
      - name: Configure Android linker
        if: matrix.method == 'android'
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          case "${{ matrix.target }}" in
            aarch64-linux-android)
              LINKER="aarch64-linux-android-clang"
              VAR="CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
              API=21
              ;;

            armv7-linux-androideabi)
              LINKER="armv7a-linux-androideabi-clang"
              VAR="CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER"
              API=19
              ;;

            i686-linux-android)
              LINKER="i686-linux-android-clang"
              VAR="CARGO_TARGET_I686_LINUX_ANDROID_LINKER"
              API=19
              ;;

            x86_64-linux-android)
              LINKER="x86_64-linux-android-clang"
              VAR="CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
              API=21
              ;;

            *)
              echo "Unsupported Android target"
              exit 1
              ;;
          esac

          if [ ! -x "$TOOLCHAIN/$LINKER" ]; then
            echo "ERROR: Linker not found: $TOOLCHAIN/$LINKER"
            echo "Available Android linkers:"
            ls "$TOOLCHAIN"/*android*clang* || true
            exit 1
          fi

          echo "$VAR=$TOOLCHAIN/$LINKER" >> "$GITHUB_ENV"

          echo "ANDROID_API=$API" >> "$GITHUB_ENV"

          echo "Configured linker: $TOOLCHAIN/$LINKER"
          echo "Android API: $API"

      # Build
      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.target }}"

          if [ "${{ matrix.method }}" = "cross" ]; then
            cross build --release --target "$TARGET"
          else
            cargo build --release --target "$TARGET"
          fi

      # Package
      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.target }}"
          NAME="stewdio-$TARGET"

          BIN="stewdio"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="stewdio.exe"
          fi

          mkdir -p "dist/$NAME"

          SOURCE="target/$TARGET/release/$BIN"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Binary not found: $SOURCE"
            exit 1
          fi

          cp "$SOURCE" "dist/$NAME/"

          if [ -f README.md ]; then
            cp README.md "dist/$NAME/"
          fi

          cd dist

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi

          echo "ASSET=dist/$NAME.${{ matrix.archive }}" >> "$GITHUB_ENV"

      # Release upload
      - name: Upload to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "$ASSET" \
            --clobber

      # Manual workflow artifact
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: stewdio-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

