name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux (native) ----
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu,        archive: tar.gz, cross: false }
          # ---- Linux (via cross) ----
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl,       archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu,       archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl,      archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: armv7-unknown-linux-gnueabihf,   archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf,  archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu,          archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: riscv64gc-unknown-linux-gnu,     archive: tar.gz, cross: true }
          # ---- Android (via cross; runs in Termux / adb shell) ----
          - { os: ubuntu-latest, target: armv7-linux-androideabi,         archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: aarch64-linux-android,           archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: x86_64-linux-android,            archive: tar.gz, cross: true }
          - { os: ubuntu-latest, target: i686-linux-android,              archive: tar.gz, cross: true }
          # ---- Windows ----
          - { os: windows-latest, target: x86_64-pc-windows-msvc,         archive: zip,    cross: false }
          - { os: windows-latest, target: aarch64-pc-windows-msvc,        archive: zip,    cross: false }
          - { os: windows-latest, target: i686-pc-windows-msvc,           archive: zip,    cross: false }
          # ---- macOS ----
          - { os: macos-latest,   target: aarch64-apple-darwin,           archive: tar.gz, cross: false }
          - { os: macos-latest,   target: x86_64-apple-darwin,            archive: tar.gz, cross: false }
          # ---- FreeBSD (via cross) ----
          - { os: ubuntu-latest, target: x86_64-unknown-freebsd,          archive: tar.gz, cross: true }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cargo)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="stewdio-${{ matrix.target }}"
          bin="stewdio"
          case "${{ matrix.target }}" in
            *windows*) bin="stewdio.exe" ;;
          esac
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          cp README.md "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          echo "ASSET=dist/$name.${{ matrix.archive }}" >> "$GITHUB_ENV"

      # Triggered by publishing a release: attach the archive to that release.
      - name: Upload to release assets
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber

      # Triggered manually: keep it as a normal workflow artifact.
      - name: Upload workflow artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: stewdio-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
