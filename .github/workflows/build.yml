name: Build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            method: cross
            archive: tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            method: cross
            archive: tar.gz

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            method: cargo
            archive: zip

          - os: windows-latest
            target: i686-pc-windows-msvc
            method: cargo
            archive: zip

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            method: cargo
            archive: zip

          # macOS
          - os: macos-latest
            target: aarch64-apple-darwin
            method: cargo
            archive: tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            method: cargo
            archive: tar.gz

          # Android
          - os: ubuntu-latest
            target: aarch64-linux-android
            method: android
            archive: tar.gz

          - os: ubuntu-latest
            target: armv7-linux-androideabi
            method: android
            archive: tar.gz

          - os: ubuntu-latest
            target: i686-linux-android
            method: android
            archive: tar.gz

          - os: ubuntu-latest
            target: x86_64-linux-android
            method: android
            archive: tar.gz

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux cross compilation
      - name: Install cross
        if: matrix.method == 'cross'
        uses: taiki-e/install-action@cross

      # Android Java
      - name: Set up Java
        if: matrix.method == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK
      - name: Setup Android SDK
        if: matrix.method == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Install NDK
      - name: Install Android NDK
        if: matrix.method == 'android'
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager)"

          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            if [ -n "${ANDROID_HOME:-}" ]; then
              SDK_ROOT="$ANDROID_HOME"
            else
              SDK_ROOT="$(dirname "$(dirname "$(dirname "$SDKMANAGER")")")"
            fi
          else
            SDK_ROOT="$ANDROID_SDK_ROOT"
          fi

          echo "Android SDK: $SDK_ROOT"

          sdkmanager --sdk_root="$SDK_ROOT" \
            --install "ndk;27.2.12479018"

          NDK="$SDK_ROOT/ndk/27.2.12479018"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: Android NDK installation failed"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

      # Android linker configuration
      - name: Configure Android linker
        if: matrix.method == 'android'
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_NDK_HOME"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$TOOLCHAIN/bin"

          CLANG="$BIN/clang"

          if [ ! -x "$CLANG" ]; then
            echo "ERROR: NDK Clang compiler not found!"
            echo "Expected: $CLANG"
            echo "Available toolchains:"
            find "$NDK/toolchains/llvm/prebuilt" -maxdepth 2 -type d || true
            exit 1
          fi

          # Select Android architecture and minimum API.
          case "${{ matrix.target }}" in

            aarch64-linux-android)
              TRIPLE="aarch64-linux-android"
              API=21
              VAR="CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
              ;;

            armv7-linux-androideabi)
              TRIPLE="armv7a-linux-androideabi"
              API=19
              VAR="CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER"
              ;;

            i686-linux-android)
              TRIPLE="i686-linux-android"
              API=19
              VAR="CARGO_TARGET_I686_LINUX_ANDROID_LINKER"
              ;;

            x86_64-linux-android)
              TRIPLE="x86_64-linux-android"
              API=21
              VAR="CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER"
              ;;

            *)
              echo "Unsupported Android target"
              exit 1
              ;;
          esac

          # Create a linker wrapper using NDK's regular Clang.
          WRAPPER="$RUNNER_TEMP/android-${{ matrix.target }}-linker"

          cat > "$WRAPPER" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec "$CLANG" --target="$TRIPLE$API" "\$@"
          EOF

          chmod +x "$WRAPPER"

          # Verify compiler and wrapper.
          "$CLANG" --version
          "$WRAPPER" --version

          # Export Cargo linker configuration.
          echo "$VAR=$WRAPPER" >> "$GITHUB_ENV"

          echo "Android target: $TRIPLE"
          echo "Android API: $API"
          echo "Android linker: $WRAPPER"

      # Build
      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.target }}"

          if [ "${{ matrix.method }}" = "cross" ]; then
            cross build --release --target "$TARGET"
          else
            cargo build --release --target "$TARGET"
          fi

      # Package
      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          TARGET="${{ matrix.target }}"
          NAME="stewdio-$TARGET"

          BIN="stewdio"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="stewdio.exe"
          fi

          mkdir -p "dist/$NAME"

          SOURCE="target/$TARGET/release/$BIN"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: Binary not found: $SOURCE"
            exit 1
          fi

          cp "$SOURCE" "dist/$NAME/"

          if [ -f README.md ]; then
            cp README.md "dist/$NAME/"
          fi

          cd dist

          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi

          echo "ASSET=dist/$NAME.${{ matrix.archive }}" >> "$GITHUB_ENV"

      # Upload release assets
      - name: Upload to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            "$ASSET" \
            --clobber

      # Upload manual workflow artifacts
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: stewdio-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

